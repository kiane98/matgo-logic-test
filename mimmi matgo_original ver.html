<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>전문 맞고 엔진 - YOU vs 마포구 타짜</title>
    <style>
        body { margin: 0; padding: 0; background-color: #111; font-family: 'Malgun Gothic', sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; overflow: hidden; }
        #game-container { width: 900px; background: #1a1a1a; position: relative; box-shadow: 0 20px 50px rgba(0,0,0,0.9); user-select: none; border-radius: 12px; overflow: hidden; }
        .ui-header { display: flex; justify-content: space-between; align-items: center; background: #2c3e50; padding: 10px 20px; border-bottom: 2px solid #34495e; color: #fff; z-index: 5; }
        canvas { width: 100%; height: auto; display: block; background: radial-gradient(circle, #3d6a26 0%, #162d0d 100%); cursor: pointer; touch-action: none; }
        
        #start-screen { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); display: flex; justify-content: center; align-items: center; z-index: 50; flex-direction: column; backdrop-filter: blur(5px); }
        #center-start-btn { padding: 20px 80px; font-size: 2.2rem; background: #f1c40f; color: #1a1a1a; border: none; border-radius: 50px; font-weight: 900; cursor: pointer; box-shadow: 0 10px 30px rgba(0,0,0,0.8); transition: transform 0.2s; transform: translateY(-10px); }
        #center-start-btn:hover { transform: translateY(-10px) scale(1.05); }

        .overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.4); display: none; z-index: 100; backdrop-filter: blur(2px); }
        .popup { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: #1b3012; border: 4px solid #f1c40f; border-radius: 25px; padding: 40px; display: none; flex-direction: column; align-items: center; gap: 20px; box-shadow: 0 0 60px rgba(0,0,0,1); min-width: 350px; text-align: center; }
        .popup-title { color: #ffffff; font-size: 1.8rem; font-weight: 900; text-shadow: 2px 2px 5px #000; text-align: center; }
        .choice-card-wrapper { width: 100px; height: 150px; border-radius: 4px; box-shadow: 0 15px 35px rgba(0,0,0,0.5); overflow: hidden; background: transparent; cursor: pointer; transition: transform 0.1s; }
        .choice-card-wrapper:hover { transform: scale(1.05); }
        .choice-card { width: 100%; height: 100%; background-repeat: no-repeat; background-size: 1200% 400%; }

        .btn-group { display: flex; gap: 20px; margin-top: 10px; }
        .sub-btn { padding: 14px 35px; border-radius: 15px; border: none; font-weight: 900; font-size: 1.3rem; cursor: pointer; white-space: nowrap; }
        .btn-yes { background: #2ecc71; color: white; box-shadow: 0 4px #27ae60; } 
        .btn-no { background: #3498db; color: white; box-shadow: 0 4px #2980b9; }  
        
        .score-box { background: rgba(0,0,0,0.3); padding: 5px 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); position: relative; cursor: help; }
        .score-box[data-tooltip]:hover::after { content: attr(data-tooltip); position: absolute; top: 100%; left: 50%; transform: translate(-50%, 10px); background: rgba(0, 0, 0, 0.95); color: #fff; padding: 12px 18px; border-radius: 8px; border: 1px solid #f1c40f; white-space: pre-wrap; font-size: 0.95rem; font-weight: normal; z-index: 100; box-shadow: 0 8px 25px rgba(0,0,0,0.8); pointer-events: none; line-height: 1.6; min-width: max-content; text-align: left; }
        .score-box[data-tooltip]:hover::before { content: ''; position: absolute; top: 100%; left: 50%; transform: translate(-50%, 2px); border-width: 0 8px 8px 8px; border-style: solid; border-color: transparent transparent #f1c40f transparent; z-index: 101; pointer-events: none; }
        
        #multiplier-tag { color: #f1c40f; font-weight: bold; margin-right: 10px; display: none; }
        .result-detail { color: #fff; font-size: 1.2rem; line-height: 1.8; text-align: center; font-weight: bold; margin-bottom: 10px; }
        
        #sound-toggle-btn { background: transparent; border: none; color: #55efc4; font-size: 1.1rem; font-weight: 900; cursor: pointer; padding: 0; margin-left: 10px; transition: transform 0.1s, color 0.2s; white-space: nowrap; }
        #sound-toggle-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body>

<div id="game-container">
    <div class="ui-header">
        <div style="display:flex; align-items:center;">
            <span id="multiplier-tag">x2 판</span>
            <span id="game-status">🕹️ 대기 중...</span>
        </div>
        <div style="display:flex; gap:15px; font-weight:bold; align-items:center;">
            <div class="score-box" id="ai-score-box" data-tooltip="점수 없음"><span style="color:#ff7675">마포구 타짜: </span><span id="ai-score">0</span>점 <span id="ai-go-status"></span></div>
            <div class="score-box" id="my-score-box" data-tooltip="점수 없음"><span style="color:#55efc4">YOU: </span><span id="my-score">0</span>점 <span id="my-go-status"></span></div>
            <button id="sound-toggle-btn">♪ ON</button>
        </div>
    </div>
    
    <div id="start-screen">
        <button id="center-start-btn">게임 시작</button>
    </div>

    <canvas id="matgoCanvas" width="900" height="650"></canvas>

    <div id="common-overlay" class="overlay">
        <div id="common-popup" class="popup">
            <div id="common-text" class="popup-title"></div>
            <div id="result-info" class="result-detail"></div>
            <div id="choice-cards-container" style="display:flex; gap:25px;"></div>
            <div class="btn-group" id="common-btns"></div>
        </div>
    </div>
</div>

<script>
// ==========================================
// 🎵 브라우저 내장 오디오 신디사이저 엔진 
// ==========================================
const SoundEngine = {
    ctx: null,
    muted: false, 
    init() {
        if (!this.ctx) {
            this.ctx = new (window.AudioContext || window.webkitAudioContext)();
        }
        if (this.ctx.state === 'suspended') {
            this.ctx.resume();
        }
    },
    toggleMute() {
        this.muted = !this.muted;
        const btn = document.getElementById('sound-toggle-btn');
        if (this.muted) {
            btn.innerText = '♪ OFF';
            btn.style.color = '#ff7675';
        } else {
            btn.innerText = '♪ ON';
            btn.style.color = '#55efc4';
        }
    },
    playOscillator(type, freqStart, freqEnd, duration, volStart = 0.5, volEnd = 0) {
        if (this.muted || !this.ctx) return; 
        const osc = this.ctx.createOscillator();
        const gain = this.ctx.createGain();
        osc.type = type;
        osc.connect(gain);
        gain.connect(this.ctx.destination);
        
        osc.frequency.setValueAtTime(freqStart, this.ctx.currentTime);
        if (freqEnd) {
            osc.frequency.exponentialRampToValueAtTime(freqEnd, this.ctx.currentTime + duration);
        }
        
        gain.gain.setValueAtTime(volStart, this.ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(Math.max(volEnd, 0.01), this.ctx.currentTime + duration);
        
        osc.start();
        osc.stop(this.ctx.currentTime + duration);
    },
    hit() { this.playOscillator('sine', 400, 150, 0.1, 0.7); },
    flip() { this.playOscillator('sine', 400, 600, 0.05, 0.1); }, 
    jjok() { this.playOscillator('square', 800, 1200, 0.15, 0.6); },
    ttadak() { 
        this.hit(); 
        setTimeout(() => this.hit(), 100); 
    },
    ppeok() { this.playOscillator('sine', 250, 60, 0.25, 0.8); },
    sweep() { 
        this.playOscillator('sine', 400, 600, 0.1, 0.5);
        setTimeout(() => this.playOscillator('sine', 600, 800, 0.1, 0.5), 100);
        setTimeout(() => this.playOscillator('sine', 800, 1200, 0.2, 0.5), 200);
    },
    go() { 
        this.playOscillator('square', 440, 440, 0.15, 0.5);
        setTimeout(() => this.playOscillator('square', 554, 554, 0.3, 0.5), 150);
    },
    stop() { 
        this.playOscillator('sawtooth', 440, 220, 0.4, 0.7);
    },
    win() { 
        [523, 659, 783, 1046].forEach((f, i) => {
            setTimeout(() => this.playOscillator('triangle', f, f, 0.2, 0.5), i * 150);
        });
    },
    lose() { 
        [440, 392, 349, 293].forEach((f, i) => {
            setTimeout(() => this.playOscillator('sine', f, f, 0.25, 0.3), i * 200);
        });
    },
    bomb() { 
        this.playOscillator('square', 100, 50, 0.5, 1.0);
    },
    bell() { 
        this.playOscillator('sine', 1200, 1200, 1.5, 0.8);
        setTimeout(() => this.playOscillator('sine', 600, 600, 1.2, 0.4), 50);
    },
    turnChange() { 
        this.playOscillator('sine', 1046, 1046, 0.15, 0.2); 
    }
};

document.getElementById('sound-toggle-btn').onclick = () => {
    SoundEngine.init();
    SoundEngine.toggleMute();
};

const cardDatabase = {
    1: ['광', '피', '홍단', '피'], 2: ['고도리', '피', '홍단', '피'], 3: ['광', '피', '홍단', '피'], 
    4: ['고도리', '피', '초단', '피'], 5: ['멍', '피', '초단', '피'], 6: ['멍', '피', '청단', '피'], 
    7: ['멍', '피', '초단', '피'], 8: ['광', '피', '고도리', '피'], 9: ['멍', '피', '청단', '피'], 
    10: ['멍', '피', '청단', '피'], 11: ['광', '피', '쌍피', '피'], 12: ['광', '멍', '띠', '쌍피'] 
};
const hwatuLayout = {
    1: {r:0, c:0}, 2: {r:0, c:1}, 3: {r:0, c:2}, 4: {r:1, c:0}, 5: {r:1, c:1}, 6: {r:1, c:2},
    7: {r:2, c:0}, 8: {r:2, c:1}, 9: {r:2, c:2}, 10: {r:3, c:0}, 12: {r:3, c:1}, 11: {r:3, c:2} 
};

const floorSlots = [
    {x:71, y:198}, {x:181, y:198}, {x:291, y:198}, {x:508, y:198}, {x:618, y:198}, {x:728, y:198},
    {x:101, y:313}, {x:211, y:313}, {x:321, y:313}, {x:538, y:313}, {x:648, y:313}, {x:758, y:313}
];
const slotPriority = [2, 3, 8, 9, 1, 4, 7, 10, 0, 5, 6, 11];

const canvas = document.getElementById('matgoCanvas');
const ctx = canvas.getContext('2d');
const imgCards = new Image();
let isImageLoaded = false;
imgCards.src = 'Hwatu.png'; 
imgCards.onload = () => { isImageLoaded = true; };

let state = {
    deck: [], playerHand: [], aiHand: [], floor: {}, slotOccupant: Array(12).fill(null),
    playerGained: { '광':[], '멍':[], '띠':[], '피':[] }, aiGained: { '광':[], '멍':[], '띠':[], '피':[] },
    movingCards: [], tempMatches: [], turn: 'PLAYER', isProcessing: false, gameStarted: false,
    shakeCount: 0, uiMessage: "", shakenMonths: [], deckAlarmAlpha: 0,
    playedCard: null, strikeType: 0, ppeokOwners: {}, ppeokCount: 0,
    nextRoundDoubled: false, isNagariRound: false,
    playerGo: 0, aiGo: 0, playerLastGoScore: 0, aiLastGoScore: 0, currentSeon: 'PLAYER',
    _roundEnding: false,
    particles: [],
    floatingTexts: [],
    winReason: "", 
    playerPpeok: 0, 
    aiPpeok: 0      
};

function emitParticles(x, y, type) {
    const goldColors = ['#f1c40f', '#f39c12', '#ffeb3b', '#e67e22', '#ffffff'];
    const bombColors = ['#e74c3c', '#c0392b', '#f1c40f', '#d35400', '#000000']; 
    let count = type === 'bomb' ? 80 : (type === 'score' ? 20 : 12);
    let colors = type === 'bomb' ? bombColors : goldColors;
    
    for(let i=0; i<count; i++) {
        state.particles.push({
            x: x, y: y,
            vx: (Math.random()-0.5) * (type === 'bomb' ? 25 : 8),
            vy: (Math.random()-0.5) * (type === 'bomb' ? 25 : 8),
            life: 1.0,
            size: Math.random() * (type === 'bomb' ? 8 : 4) + 2,
            color: colors[Math.floor(Math.random() * colors.length)]
        });
    }
}

class Card {
    constructor(month, type, idxInMonth) {
        this.month = month; this.idxInMonth = idxInMonth;
        this.type = (type === '쌍피') ? '피' : type;
        this.piCount = (type === '쌍피') ? 2 : 1;
        
        this.x = 422; this.y = 243; this.tx = this.x; this.ty = this.y;
        this.w = 56; this.h = 84; this.isMoving = false;
        this.moveType = 'LINEAR'; this.animFrame = 0; this.totalFrames = 0;
        this.offsetX = 0; this.offsetY = 0; this.scale = 1.0;
        this.isHighlight = false; this.isHidden = false;
        this.isStolen = false; 
        if (month === 9 && this.type === '멍') this.canTransform = true; 
    }

    async moveTo(tx, ty, duration = 20, type = 'LINEAR') {
        this.startX = this.x; this.startY = this.y; this.tx = tx; this.ty = ty;
        this.animFrame = 0; this.totalFrames = duration; this.moveType = type; this.isMoving = true;
        if (!state.movingCards.includes(this)) state.movingCards.push(this);
        return new Promise(resolve => {
            const animate = () => {
                if (this.animFrame < this.totalFrames) {
                    this.animFrame++; const t = this.animFrame / this.totalFrames;
                    if (this.isStolen) {
                        state.particles.push({
                            x: this.x + this.offsetX, y: this.y + this.offsetY,
                            vx: (Math.random() - 0.5) * 2, vy: (Math.random() - 0.5) * 2,
                            life: 0.8, size: Math.random() * 3 + 2,
                            color: `hsl(45, 100%, ${50 + Math.random()*50}%)`
                        });
                    }
                    if (this.moveType === 'PARABOLIC') { this.x = this.startX + (this.tx - this.startX) * t; this.y = this.startY + (this.ty - this.startY) * t - Math.sin(t * Math.PI) * 240; this.scale = 1 + Math.pow(Math.sin(t * Math.PI), 0.5) * 2.5; }
                    else if (this.moveType === 'FLIP_POP') { 
                        const s1 = 0.20, s2 = 0.35, ts = 2.5;
                        if (t < s1) { const nt = t / s1; this.scale = 1 + (ts - 1) * nt; this.x = this.startX; this.y = this.startY; }
                        else if (t < s2) { this.scale = ts; this.x = this.startX; this.y = this.startY; }
                        else { const nt = (t - s2) / (1 - s2); this.x = this.startX + (this.tx - this.startX) * nt; this.y = this.startY + (this.ty - this.startY) * nt; this.scale = ts - (ts - 1) * nt; }
                    }
                    else { this.x = this.startX + (this.tx - this.startX) * t; this.y = this.startY + (this.ty - this.startY) * t; }
                    requestAnimationFrame(animate);
                } else { 
                    this.x = this.tx; this.y = this.ty; this.scale = 1.0; this.isMoving = false; 
                    state.movingCards = state.movingCards.filter(c => c !== this);
                    resolve(); 
                }
            }; animate();
        });
    }

    draw() {
        ctx.save();
        let vs = this.scale; let dW = this.w * vs; let dH = this.h * vs;
        const rx = this.x + this.offsetX - (dW - this.w) / 2; const ry = this.y + this.offsetY - (dH - this.h) / 2;
        if (this.isHighlight) { ctx.shadowBlur = 15; ctx.shadowColor = "#f1c40f"; }
        if (this.isHidden) { 
            ctx.beginPath(); ctx.roundRect(rx, ry, dW, dH, 4);
            ctx.fillStyle = "#c0392b"; ctx.fill(); ctx.strokeStyle = "rgba(255,255,255,0.4)"; ctx.lineWidth = 1; ctx.stroke(); 
        }
        else if (isImageLoaded) {
            ctx.beginPath(); ctx.roundRect(rx, ry, dW, dH, 4);
            ctx.save(); ctx.clip();
            const sw = imgCards.naturalWidth / 12, sh = imgCards.naturalHeight / 4, layout = hwatuLayout[this.month];
            ctx.drawImage(imgCards, (layout.c*4+this.idxInMonth)*sw, layout.r*sh, sw, sh, rx, ry, dW, dH);
            ctx.restore();
            if (this.isHighlight) { ctx.strokeStyle = "rgba(241, 196, 15, 0.8)"; ctx.lineWidth = 2; ctx.stroke(); }
        }
        ctx.restore();
    }
}

function drawMatchIndicator(x, y, w, type = 'blue') {
    ctx.save();
    const cx = x + w / 2, ty = y - 8, th = 26, tw = 25, r = 5;
    ctx.beginPath(); ctx.moveTo(cx - tw/2 + r, ty); ctx.lineTo(cx + tw/2 - r, ty);
    ctx.quadraticCurveTo(cx + tw/2, ty, cx + tw/2, ty + r); ctx.lineTo(cx, ty + th);
    ctx.lineTo(cx - tw/2, ty + r); ctx.quadraticCurveTo(cx - tw/2, ty, cx - tw/2 + r, ty);
    ctx.closePath();
    const grad = ctx.createLinearGradient(cx, ty, cx, ty + th);
    if (type === 'gray') { grad.addColorStop(0, "#bdc3c7"); grad.addColorStop(1, "#7f8c8d"); } 
    else { grad.addColorStop(0, "#00c3ff"); grad.addColorStop(1, "#0047ab"); }
    ctx.fillStyle = grad; ctx.fill(); ctx.strokeStyle = "#ffffff"; ctx.lineWidth = 2.5; ctx.stroke();
    ctx.restore();
}

function checkChongtong(hand) {
    const counts = {}; hand.forEach(c => { counts[c.month] = (counts[c.month] || 0) + 1; });
    for (const m in counts) { if (counts[m] === 4) return parseInt(m); }
    return null;
}

function calculateTotalScore(who) {
    const g = (who === 'PLAYER') ? state.playerGained : state.aiGained; let total = 0;
    const gwangCount = g['광'].length;
    if (gwangCount === 5) total += 15; else if (gwangCount === 4) total += 4; else if (gwangCount === 3) { const hasBiGwang = g['광'].some(c => c.month === 12); total += hasBiGwang ? 2 : 3; }
    const hongdanCards = g['띠'].filter(c => [1,2,3].includes(c.month) && c.idxInMonth === 2);
    if (hongdanCards.length === 3) total += 3;
    const cheongdanCards = g['띠'].filter(c => [6,9,10].includes(c.month) && c.idxInMonth === 2);
    if (cheongdanCards.length === 3) total += 3;
    const chodanCards = g['띠'].filter(c => [4,5,7].includes(c.month) && c.idxInMonth === 2);
    if (chodanCards.length === 3) total += 3;
    if (g['띠'].length >= 5) total += (g['띠'].length - 4);
    const godori = g['멍'].filter(c => (c.month === 2 && c.idxInMonth === 0) || (c.month === 4 && c.idxInMonth === 0) || (c.month === 8 && c.idxInMonth === 2)).length === 3;
    if (godori) total += 5; if (g['멍'].length >= 5) total += (g['멍'].length - 4);
    const piPoints = g['피'].reduce((acc, c) => acc + c.piCount, 0);
    if (piPoints >= 10) total += (piPoints - 9);
    const goCnt = (who === 'PLAYER') ? state.playerGo : state.aiGo;
    if (goCnt === 1) total += 1; if (goCnt === 2) total += 2;
    return total;
}

function updateScoreTooltip(who) {
    const g = (who === 'PLAYER') ? state.playerGained : state.aiGained;
    let details = [];
    const gwangCount = g['광'].length;
    if (gwangCount === 5) details.push("오광: 15점"); else if (gwangCount === 4) details.push("사광: 4점"); else if (gwangCount === 3) { const hasBiGwang = g['광'].some(c => c.month === 12); details.push(hasBiGwang ? "비삼광: 2점" : "삼광: 3점"); }
    if (g['띠'].filter(c => [1,2,3].includes(c.month) && c.idxInMonth === 2).length === 3) details.push("홍단: 3점");
    if (g['띠'].filter(c => [6,9,10].includes(c.month) && c.idxInMonth === 2).length === 3) details.push("청단: 3점");
    if (g['띠'].filter(c => [4,5,7].includes(c.month) && c.idxInMonth === 2).length === 3) details.push("초단: 3점");
    if (g['띠'].length >= 5) details.push(`띠 ${g['띠'].length}장: ${g['띠'].length - 4}점`);
    if (g['멍'].filter(c => (c.month === 2 && c.idxInMonth === 0) || (c.month === 4 && c.idxInMonth === 0) || (c.month === 8 && c.idxInMonth === 2)).length === 3) details.push("고도리: 5점");
    if (g['멍'].length >= 5) details.push(`멍 ${g['멍'].length}장: ${g['멍'].length - 4}점`);
    const piPoints = g['피'].reduce((acc, c) => acc + c.piCount, 0);
    if (piPoints >= 10) details.push(`피 ${piPoints}장: ${piPoints - 9}점`);
    const goCnt = (who === 'PLAYER') ? state.playerGo : state.aiGo;
    if (goCnt === 1) details.push("1고: 1점"); else if (goCnt >= 2) details.push(`${goCnt}고: 2점`);
    const boxId = who === 'PLAYER' ? 'my-score-box' : 'ai-score-box';
    document.getElementById(boxId).setAttribute('data-tooltip', details.length === 0 ? '점수 없음' : details.join('\n'));
}

function finalizeSettlement(winner) {
    const winGained = (winner === 'PLAYER') ? state.playerGained : state.aiGained;
    const loseGained = (winner === 'PLAYER') ? state.aiGained : state.playerGained;
    const winGo = (winner === 'PLAYER') ? state.playerGo : state.aiGo;
    const loseGo = (winner === 'PLAYER') ? state.aiGo : state.playerGo;
    let baseScore = calculateTotalScore(winner);
    if (state.winReason && (state.winReason.includes("총통") || state.winReason.includes("3뻑"))) baseScore = Math.max(7, baseScore);
    let multipliers = []; let finalMul = 1;
    if (winGo >= 3) { let goMul = Math.pow(2, winGo - 2); finalMul *= goMul; multipliers.push(`${winGo}고(x${goMul})`); }
    const losePiPoints = loseGained['피'].reduce((acc, c) => acc + c.piCount, 0);
    if (winGained['피'].length >= 10 && losePiPoints <= 5) { finalMul *= 2; multipliers.push(`피박(x2)`); }
    if (winGained['광'].length >= 3 && loseGained['광'].length === 0) { finalMul *= 2; multipliers.push(`광박(x2)`); }
    if (winGained['멍'].length >= 7) { finalMul *= 2; multipliers.push(`멍박(x2)`); }

function getGainedPosition(who, category, index, piArray = []) {
    const by = (who === 'PLAYER') ? 560 : 10, ty = (who === 'PLAYER') ? 475 : 95, dir = (who === 'PLAYER') ? -1 : 1;
    if (category === '광') return { x: 20 + index * 18, y: by };

    if (category === '멍') return { x: 160 + index * 22, y: ty };
    if (category === '피') {

        for (let i = 0; i <= index; i++) {
            const c = piArray[i]; if (!c) break; const pts = c.piCount;

            if (i === index) return { x: 350 + cc * 24, y: by + (cr * 40 * dir) };
            cp += pts; cc++; if (cp === 5) { cr++; cp = 0; cc = 0; }

function formatPiArray(arr) {

    }
}

    return new Promise(resolve => {
        if (isSelectMode) { cardElems.forEach((div, i) => { div.onclick = () => { div.onclick = null; overlay.style.display = 'none'; popup.style.display = 'none'; resolve(cards[i]); }; }); }
        if (options.length === 0 && !isSelectMode) { const btn = document.createElement('button'); btn.className = `sub-btn btn-yes`; btn.innerText = "확인"; btn.onclick = () => { btn.onclick = null; overlay.style.display = 'none'; popup.style.display = 'none'; resolve("OK"); }; btnGroup.appendChild(btn); }
        options.forEach(opt => { const btn = document.createElement('button'); btn.className = `sub-btn ${opt.class}`; btn.innerText = opt.label; btn.onclick = async () => { btn.onclick = null; overlay.style.display = 'none'; popup.style.display = 'none'; resolve(opt.value); }; btnGroup.appendChild(btn); });
    });
}

async function handleGukjinTransform(card) {
    const res = await showPopup("국진을 쌍피로 이동하시겠습니까?", [card], [{label: "쌍피 이동", value: "MOVE", class: "btn-yes"}, {label: "취소", value: "CANCEL", class: "btn-no"}]);
    if (res === "MOVE") { state.isProcessing = true; let moveIdx = state.playerGained['멍'].indexOf(card); card.piCount = 2; card.type = '피'; state.playerGained['멍'].splice(moveIdx, 1); state.playerGained['피'].push(card); card.isMoving = true; reorganizeGained('PLAYER'); SoundEngine.flip(); await card.moveTo(card.tx, card.ty, 15, 'LINEAR'); state.isProcessing = false; }
}

document.getElementById('center-start-btn').onclick = () => { SoundEngine.init(); document.getElementById('start-screen').style.display = 'none'; startGame(); };

async function startGame() {
    state.isProcessing = true; state.winReason = ""; state.playerPpeok = 0; state.aiPpeok = 0;
    document.getElementById('common-overlay').style.display = 'none'; document.getElementById('common-popup').style.display = 'none';
    state.isNagariRound = state.nextRoundDoubled;
    document.getElementById('multiplier-tag').style.display = state.isNagariRound ? 'inline' : 'none';
    document.getElementById('game-status').innerText = `🕹️ 경기 중 (선: ${state.currentSeon === 'PLAYER' ? 'YOU' : '마포구 타짜'})`;
    document.getElementById('ai-score').innerText = '0'; document.getElementById('my-score').innerText = '0';
    state.uiMessage = ""; state.deck = []; state.ppeokOwners = {}; state.playerGo = 0; state.aiGo = 0; state.playerLastGoScore = 0; state.aiLastGoScore = 0; state.shakeCount = 0;
    state.movingCards = []; state.tempMatches = []; state.strikeType = 0; state.particles = []; state.floatingTexts = [];
    for(let m=1; m<=12; m++) state.deck.push(new Card(m, cardDatabase[m][0], 0), new Card(m, cardDatabase[m][1], 1), new Card(m, cardDatabase[m][2], 2), new Card(m, cardDatabase[m][3], 3));
    state.deck.sort(() => Math.random() - 0.5);
    state.playerHand = []; state.aiHand = []; state.floor = {}; state.slotOccupant = Array(12).fill(null);
    state.playerGained = { '광':[], '멍':[], '띠':[], '피':[] }; state.aiGained = { '광':[], '멍':[], '띠':[], '피':[] };
    state.shakenMonths = []; state.gameStarted = true; 
    const deal = async (f, a, p) => {
        for(let i=0; i<f; i++) { SoundEngine.flip(); await placeOnFloor(state.deck.pop()); }
        for(let i=0; i<a; i++) { let c = state.deck.pop(); c.w = 40; c.h = 60; c.isHidden = true; SoundEngine.flip(); await c.moveTo(600 + state.aiHand.length * 15, 30, 8); state.aiHand.push(c); }
        for(let i=0; i<p; i++) { let c = state.deck.pop(); c.w = 65; c.h = 97.5; state.playerHand.push(c); sortHandAndArrange(); SoundEngine.flip(); await c.moveTo(c.tx, c.ty, 8); }
    };
    await deal(4, 5, 5); await deal(4, 5, 5);
    const pC = checkChongtong(state.playerHand), aC = checkChongtong(state.aiHand);
    let floorChong = null; for (const m in state.floor) { if (state.floor[m].length === 4) floorChong = parseInt(m); }
    if (pC || aC || floorChong) {
        state.isProcessing = false;
        if (floorChong) { state.winReason = "바닥 총통"; finishRound(state.currentSeon); }
        else if (pC && aC) { state.nextRoundDoubled = true; await showPopup("무승부!", [], [{label: "그만하기", value: "QUIT", class: "btn-no"},{label: "다음 판 하기", value: "NEXT", class: "btn-yes"}], false, `쌍방 총통입니다.<br>다음 판 점수가 2배로 시작됩니다! 🔥`).then(r => { if(r==="QUIT") { document.getElementById('start-screen').style.display='flex'; state.gameStarted=false; state.nextRoundDoubled=false; document.getElementById('multiplier-tag').style.display='none'; } else { requestAnimationFrame(() => { requestAnimationFrame(async () => { await startGame(); }); }); }}); } 
        else if (pC) { state.winReason = pC + "월 총통"; finishRound('PLAYER'); } 
        else { state.winReason = aC + "월 총통"; finishRound('AI'); }
        return;
    }
    state.turn = state.currentSeon;
    if (state.turn === 'AI') { state.isProcessing = true; setTimeout(aiTurn, 1200); } else { state.isProcessing = false; }
}

function sortHandAndArrange() { state.playerHand.sort((a, b) => a.month - b.month); state.playerHand.forEach((c, i) => { const col = i % 5, row = Math.floor(i / 5); c.tx = 540 + col * 64; c.ty = 430 + row * 105; if(!c.isMoving) { c.x = c.tx; c.y = c.ty; } }); }
function sortAiHandAndArrange() { state.aiHand.forEach((c, i) => { c.tx = 600 + i * 15, c.ty = 30; if(!c.isMoving) c.moveTo(c.tx, c.ty, 15); }); }

function aiTurn() { 
    if(!state.gameStarted) return; state.isProcessing = true; 
    if (state.aiHand.length === 0 && state.deck.length > 0) { flipPhase('AI'); return; } 
    if (state.aiHand.length === 0) return; 
    let bestIdx = 0, maxWeight = -9999, oppPiCount = state.playerGained['피'].reduce((a,c) => a + c.piCount, 0);
    for (let i = 0; i < state.aiHand.length; i++) {
        let c = state.aiHand[i], w = 0, f = state.floor[c.month] || [];
        if (f.length > 0) { w += 100; if (f.some(fc => fc.piCount >= 2)) w += 50; if (f.length === 3) w += 40 + (oppPiCount >= 5 ? 20 : 0); if (c.piCount >= 2 || c.type === '광' || c.type === '고도리') w += 10; } 
        else { if (c.piCount === 1 && c.type === '피') w += 20; else if (c.type === '멍' || c.type === '띠') w += 10; else if (c.type === '광' || c.piCount >= 2) w -= 30; }
        if (w > maxWeight) { maxWeight = w; bestIdx = i; }
    }
    const played = state.aiHand.splice(bestIdx, 1)[0]; played.isHidden = false; played.w = 56; played.h = 84; sortAiHandAndArrange(); strikeLogic('AI', played).then(() => flipPhase('AI')); 
}

function processPlayerClick(mx, my) {
    SoundEngine.init(); if (state.turn !== 'PLAYER') return;
    for (const card of state.playerGained['멍']) { if (card.month === 9 && mx >= card.x && mx <= card.x + card.w && my >= card.y && my <= card.y + card.h) { handleGukjinTransform(card); return; } }
    if (state.playerHand.length === 0 && state.deck.length > 0) { if (mx >= 410 && mx <= 485 && my >= 235 && my <= 335) { flipPhase('PLAYER'); return; } }
    if (state.isProcessing) return;
    let clickedIdx = -1; for (let i = state.playerHand.length - 1; i >= 0; i--) { const c = state.playerHand[i]; if (mx >= c.x && mx <= c.x + c.w && my >= c.y && my <= c.y + c.h) { clickedIdx = i; break; } }
    if(clickedIdx !== -1) handlePlayerClick(clickedIdx);
}

canvas.addEventListener('mousedown', function(e) {
    if(!state.gameStarted || document.getElementById('common-overlay').style.display === 'block') return;
    const rect = canvas.getBoundingClientRect(), mx = (e.clientX - rect.left) * (canvas.width / rect.width), my = (e.clientY - rect.top) * (canvas.height / rect.height);
    processPlayerClick(mx, my);
});

canvas.addEventListener('touchstart', function(e) {
    if(!state.gameStarted || document.getElementById('common-overlay').style.display === 'block') return;
    e.preventDefault();
    const rect = canvas.getBoundingClientRect(), touch = e.touches[0] || e.changedTouches[0], mx = (touch.clientX - rect.left) * (canvas.width / rect.width), my = (touch.clientY - rect.top) * (canvas.height / rect.height);
    processPlayerClick(mx, my);
}, {passive: false});

function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    if (state.deck.length > 0 || !state.gameStarted) {
        state.deckAlarmAlpha = (Math.sin(Date.now() / 200) + 1) / 2;
        if (state.turn === 'PLAYER' && state.playerHand.length === 0 && !state.isProcessing && state.gameStarted && state.deck.length > 0) { ctx.save(); ctx.shadowBlur = 20; ctx.shadowColor = "yellow"; ctx.strokeStyle = `rgba(241, 196, 15, ${state.deckAlarmAlpha})`; ctx.lineWidth = 6; ctx.roundRect(422 - 5, 243 - 5, 66, 94, 8); ctx.stroke(); ctx.restore(); }
        for(let i=3; i>=0; i--) { ctx.save(); ctx.translate(422 - i*0.8, 243 - i*0.8); ctx.fillStyle = "#c0392b"; ctx.beginPath(); ctx.roundRect(0, 0, 56, 84, 5); ctx.fill(); ctx.strokeStyle = "#801d12"; ctx.lineWidth = 1; ctx.stroke(); ctx.restore(); }
    }
    ctx.save(); ctx.setLineDash([6, 4]); ctx.strokeStyle = "rgba(255,255,255,0.15)"; ctx.lineWidth = 2; ctx.roundRect(595, 25, 185, 70, 8); ctx.roundRect(530, 420, 350, 225, 8); ctx.stroke(); ctx.restore();
    Object.values(state.floor).forEach(g => g.forEach(c => { if(!c.isMoving && !c.isHighlight) c.draw(); }));
    state.aiHand.forEach(c => { if(!c.isMoving) c.draw(); });
    state.playerHand.forEach(c => { 
        if(!c.isMoving) { 
            c.draw(); if (state.turn === 'PLAYER' && !state.isProcessing && state.gameStarted) {
                let gainedCount = 0; ['광', '멍', '띠', '피'].forEach(cat => { state.playerGained[cat].forEach(gc => { if(gc.month === c.month) gainedCount++; }); state.aiGained[cat].forEach(gc => { if(gc.month === c.month) gainedCount++; }); });
                let floorCount = state.floor[c.month] ? state.floor[c.month].length : 0, handCount = state.playerHand.filter(hc => hc.month === c.month).length;
                if (gainedCount + floorCount + handCount === 4) drawMatchIndicator(c.x, c.y, c.w, 'gray'); else if (floorCount > 0) drawMatchIndicator(c.x, c.y, c.w, 'blue');
            } 
        } 
    });
    [state.playerGained, state.aiGained].forEach(g => { ['광', '멍', '띠', '피'].forEach(cat => { const l = g[cat]; for (let i = 0; i < l.length; i++) { if (!l[i].isMoving) l[i].draw(); } }); });
    Object.values(state.floor).forEach(g => g.forEach(c => { if(!c.isMoving && c.isHighlight) c.draw(); }));
    state.tempMatches.forEach(c => { if(!c.isMoving) c.draw(); });
    state.movingCards.forEach(c => c.draw());
    for (let i = state.particles.length - 1; i >= 0; i--) { let p = state.particles[i]; p.x += p.vx; p.y += p.vy; p.life -= 0.03; if (p.life <= 0) { state.particles.splice(i, 1); } else { ctx.save(); ctx.globalAlpha = Math.max(0, p.life); ctx.fillStyle = p.color; ctx.shadowBlur = p.size * 2; ctx.shadowColor = p.color; ctx.beginPath(); ctx.arc(p.x, p.y, p.size, 0, Math.PI*2); ctx.fill(); ctx.restore(); } }
    for (let i = state.floatingTexts.length - 1; i >= 0; i--) { let ft = state.floatingTexts[i]; ft.y += ft.vy; ft.life -= 0.02; if (ft.life <= 0) { state.floatingTexts.splice(i, 1); } else { ctx.save(); ctx.globalAlpha = Math.max(0, ft.life); ctx.fillStyle = ft.color; ctx.font = "900 45px Arial, sans-serif"; ctx.textAlign = "center"; ctx.strokeStyle = "#000"; ctx.lineWidth = 5; ctx.shadowBlur = 10; ctx.shadowColor = "rgba(0,0,0,0.8)"; ctx.strokeText(ft.text, ft.x, ft.y); ctx.fillText(ft.text, ft.x, ft.y); ctx.restore(); } }
    if(state.uiMessage) { ctx.save(); ctx.fillStyle = "rgba(0,0,0,0.6)"; ctx.fillRect(0, 290, 900, 70); ctx.fillStyle = "#f1c40f"; ctx.font = "bold 35px Malgun Gothic"; ctx.textAlign = "center"; ctx.fillText(state.uiMessage, 450, 335); ctx.restore(); }
    requestAnimationFrame(loop);
}

CanvasRenderingContext2D.prototype.roundRect = function (x, y, w, h, r) { this.beginPath(); this.moveTo(x + r, y); this.arcTo(x + w, y, x + w, y + h, r); this.arcTo(x + w, y + h, x, y + h, r); this.arcTo(x, y + h, x, y, r); this.arcTo(x, y, x + w, y, r); this.closePath(); return this; }
loop();
